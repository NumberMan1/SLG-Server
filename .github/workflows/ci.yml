name: Server CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOPRIVATE: github.com/NumberMan1/orbit
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: slg-ci-root
          MYSQL_DATABASE: slg
          MYSQL_USER: slg
          MYSQL_PASSWORD: slg-ci
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysql --protocol=tcp -h127.0.0.1 -uslg -pslg-ci slg -e 'SELECT 1'"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:8.2.10-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
      etcd:
        image: quay.io/coreos/etcd:v3.7.2
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
        ports:
          - 2379/tcp
    steps:
      # The etcd image has no shell for Docker's --health-cmd.
      - name: Wait for etcd
        env:
          ETCD_PORT: ${{ job.services.etcd.ports['2379'] }}
        run: |
          curl --fail --silent --show-error --max-time 2 \
            --retry 15 --retry-connrefused --retry-delay 1 \
            "http://127.0.0.1:${ETCD_PORT}/readyz"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download and verify Go modules
        env:
          ORBIT_READ_TOKEN: ${{ secrets.ORBIT_READ_TOKEN }}
        run: |
          if [ -z "$ORBIT_READ_TOKEN" ]; then
            echo "::error::Set the ORBIT_READ_TOKEN Actions secret with read access to NumberMan1/orbit."
            exit 1
          fi
          authorization=$(printf 'x-access-token:%s' "$ORBIT_READ_TOKEN" | base64 -w0)
          echo "::add-mask::$authorization"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/NumberMan1/orbit.extraheader \
            GIT_CONFIG_VALUE_0="Authorization: Basic $authorization" \
            go mod download
          go mod verify

      - name: Verify Go and C++ services
        env:
          SLG_TEST_MYSQL_DSN: slg:slg-ci@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/slg
          SLG_TEST_REDIS_ADDRESSES: 127.0.0.1:${{ job.services.redis.ports['6379'] }}
          SLG_TEST_ETCD_ENDPOINTS: http://127.0.0.1:${{ job.services.etcd.ports['2379'] }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmariadb-dev
          sh scripts/verify.sh

      - name: Build Go services
        run: go build ./cmd/...
